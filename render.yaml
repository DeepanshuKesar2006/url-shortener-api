services:
  - type: web
    name: snip-url-shortener
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./shortener.db
      - key: PYTHON_VERSION
        value: 3.11.9
